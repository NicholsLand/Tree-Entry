<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree Data Entry</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--text:#1d2a22;--muted:#5d6b62;--line:#d9ded8;--accent:#2f6b3f;--accent-text:#fff;--err:#b3261e;--band:#eaf0ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d261f;--text:#e8eee9;--muted:#9aaa9f;--line:#334036;--accent:#6fbf83;--accent-text:#0e1a12;--err:#f2b8b5;--band:#26332a}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1d261f;--text:#e8eee9;--muted:#9aaa9f;--line:#334036;--accent:#6fbf83;--accent-text:#0e1a12;--err:#f2b8b5;--band:#26332a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:0 0 4px}
h2{font-size:1rem;margin:0 0 10px}
p.sub{margin:0 0 16px;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;box-sizing:border-box;padding:10px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
#msg{color:var(--err);font-size:.9rem;min-height:1.2em;margin-top:10px}
#msg.ok{color:var(--accent)}
.plotbar{display:flex;gap:8px;align-items:flex-end}
.plotbar>div{flex:1}
.curplot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.curplot b{font-size:1.2rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}
tr.ph td{background:var(--band);font-weight:600;white-space:normal}
tr.ph button{padding:2px 10px;font-size:.8rem;margin-left:8px}
td button{padding:2px 8px;font-size:.8rem}
.count{color:var(--muted);font-size:.9rem}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Tree Data Entry</h1>
<p class="sub">Start a plot, then add as many trees to it as you need. When you’re done, download everything as a CSV.</p>

<div class="card" id="plotcard">
  <h2>Plot</h2>
  <div id="startbox" class="plotbar">
    <div><label for="plot">PlotID</label><input id="plot" autocomplete="off"></div>
    <button class="primary" id="start">Start plot</button>
  </div>
  <div id="curbox" class="curplot hide">
    <span>Entering trees for plot <b id="curid"></b> <span class="count" id="curcount"></span></span>
    <button id="newplot">New plot</button>
  </div>
</div>

<div class="card hide" id="treecard">
  <h2>Add a tree</h2>
  <div class="grid">
    <div><label for="species">Species</label><input id="species" list="spl" autocomplete="off"><datalist id="spl"></datalist></div>
    <div><label for="dbh">DBH (in)</label><input id="dbh" type="number" step="0.1" min="0.1" inputmode="decimal"></div>
    <div><label for="product">Product</label><select id="product"></select></div>
    <div><label for="tht">Total Ht (ft)</label><input id="tht" type="number" step="1" min="1" inputmode="numeric"></div>
    <div><label for="mht">Merch Ht (optional)</label><input id="mht" type="number" step="1" min="0" inputmode="numeric"></div>
    <div><label for="defect">Defect (optional)</label><input id="defect" list="dfl" autocomplete="off" placeholder="e.g. canker"><datalist id="dfl"></datalist></div>
  </div>
  <div class="row">
    <button class="primary" id="add">Add tree</button>
    <span id="msg" role="status"></span>
  </div>
</div>

<div class="card">
  <div class="row" style="margin-top:0;justify-content:space-between">
    <span class="count" id="count">0 trees</span>
    <span>
      <button class="primary" id="dl" disabled>Download CSV</button>
      <button id="copy" disabled>Copy CSV</button>
      <button id="clear" disabled>Clear all</button>
    </span>
  </div>
  <div id="msg2" role="status" style="font-size:.9rem;color:var(--accent);min-height:1.2em;margin-top:8px"></div>
  <div class="tablewrap" style="margin-top:12px">
    <table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
  </div>
</div>
</main>

<script>
const COLS=["PlotID","Species","DBH","Product","Total Ht","Merch Ht","Defect"];
const SPECIES=["7 pine cull", "8 hardwood cull", "57 juniper/eastern red cedar", "107 sand pine", "110 shortleaf pine", "111 slash pine", "115 spruce pine", "121 longleaf pine", "128 pond pine", "131 loblolly pine", "132 Virginia pine", "221 bald cypress", "222 pond cypress", "299 misc. soft hardwood", "316 red maple", "317 silver maple", "370 birch", "391 American hornbeam", "400 hickory", "531 American beech", "540 ash", "602 black walnut", "611 sweetgum", "621 yellow/tulip poplar", "652 southern magnolia", "653 sweetbay", "691 water tupelo", "693 blackgum", "701 hophornbeam", "731 American sycamore", "740 cottonwood", "762 black cherry", "802 white oak", "812 southern red oak", "813 cherrybark oak", "820 laurel oak", "822 overcup oak", "824 blackjack oak", "825 swamp chestnut oak", "827 water oak", "832 chestnut oak", "833 northern red oak", "834 Shumard oak", "835 post oak", "837 black oak", "838 live oak", "950 basswood", "970 elm"];
const PRODUCTS=["21 (1/20 ac) All hardwood sawlogs; all pine sawlogs in Alabama and Georgia", "24 (1/20 ac) Pine chip-n-saw", "25 (1/20 ac) All pulpwood", "26 (1/20 ac) All pine pulpwood forever", "41 (1/40 ac) All hardwood sawlogs; all pine sawlogs in Alabama and Georgia", "44 (1/40 ac) Pine chip-n-saw", "45 (1/40 ac) All pulpwood", "46 (1/40 ac) All pine pulpwood forever", "47 (1/40 ac) All pine regeneration 2.0-3.5 in DBH; all hardwood regeneration 2.0-4.5 in DBH"];
const DEFECTS=["Canker", "Catface", "Rust", "Conk", "Crook", "Sweep", "Fork", "Cavity", "Rot", "Seam", "Lean", "Dead top", "Broken top"];
const KEY="tree-data-rows",KEY2="tree-data-current-plot";
let rows=[],cur="";
const $=id=>document.getElementById(id);

try{const s=localStorage.getItem(KEY);if(s)rows=JSON.parse(s)||[];cur=localStorage.getItem(KEY2)||"";}catch(e){rows=[];cur="";}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows));localStorage.setItem(KEY2,cur);}catch(e){}}

$("head").innerHTML=COLS.slice(1).map(c=>"<th>"+c+"</th>").join("")+"<th></th>";
$("spl").innerHTML=SPECIES.map(s=>"<option value=\""+s+"\">").join("");
$("dfl").innerHTML=DEFECTS.map(s=>"<option value=\""+s+"\">").join("");
$("product").innerHTML="<option value=\"\"></option>"+PRODUCTS.map(p=>"<option>"+p+"</option>").join("");

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function msg(t,ok){const m=$("msg");m.textContent=t;m.className=ok?"ok":"";const m2=$("msg2");m2.textContent=t;m2.style.color=ok?"var(--accent)":"var(--err)";}

// rows grouped by plot, plots in order of first entry; each item keeps its index in rows
function groups(){
  const order=[],map={};
  rows.forEach((r,i)=>{const p=String(r[0]);if(!map[p]){map[p]=[];order.push(p);}map[p].push(i);});
  return order.map(p=>({plot:p,idx:map[p]}));
}
function render(){
  const g=groups();
  let html="";
  g.forEach(gr=>{
    const n=gr.idx.length;
    html+="<tr class=\"ph\"><td colspan=\"7\">Plot "+esc(gr.plot)+" · "+n+(n===1?" tree":" trees")+
      (gr.plot!==cur?"<button data-plot=\""+esc(gr.plot)+"\">Add trees</button>":" (current)")+"</td></tr>";
    gr.idx.forEach(i=>{
      html+="<tr>"+rows[i].slice(1).map(v=>"<td>"+esc(v)+"</td>").join("")+
        "<td><button data-i=\""+i+"\" aria-label=\"Delete tree\">✕</button></td></tr>";
    });
  });
  $("body").innerHTML=html;
  const np=g.length;
  $("count").textContent=rows.length+(rows.length===1?" tree":" trees")+" in "+np+(np===1?" plot":" plots");
  $("dl").disabled=$("copy").disabled=$("clear").disabled=rows.length===0;
  const has=cur!=="";
  $("startbox").classList.toggle("hide",has);
  $("curbox").classList.toggle("hide",!has);
  $("treecard").classList.toggle("hide",!has);
  if(has){
    $("curid").textContent=cur;
    const n=rows.filter(r=>String(r[0])===cur).length;
    $("curcount").textContent="("+n+(n===1?" tree":" trees")+" so far)";
  }
}
function startPlot(p){
  cur=p;save();render();msg("");$("species").focus();
}
$("start").onclick=()=>{const p=$("plot").value.trim();if(!p)return;$("plot").value="";startPlot(p);};
$("plot").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("start").click();}});
$("newplot").onclick=()=>{cur="";save();render();msg("");$("plot").focus();};
$("body").onclick=e=>{
  const pb=e.target.closest("button[data-plot]");
  if(pb){startPlot(pb.dataset.plot);return;}
  const b=e.target.closest("button[data-i]");
  if(b){rows.splice(+b.dataset.i,1);save();render();}
};

$("add").onclick=()=>{
  if(!cur)return msg("Start a plot first.");
  const v={sp:$("species").value.trim(),dbh:$("dbh").value,pr:$("product").value,t:$("tht").value,m:$("mht").value,d:$("defect").value.trim()};
  if(!v.sp||!v.pr||v.dbh===""||v.t==="")return msg("Please fill in every field except Merch Ht and Defect.");
  const dbh=+v.dbh,t=+v.t,m=+v.m;
  if(!SPECIES.includes(v.sp))return msg("Pick a species from the list (code + name, e.g. 802 white oak).");
  if(!(dbh>0))return msg("DBH must be greater than 0.");
  if(!(t>0))return msg("Total Ht must be greater than 0.");
  if(v.m!==""&&(m<0||m>t))return msg("Merch Ht must be between 0 and Total Ht.");
  rows.push([cur,v.sp,dbh,v.pr,t,v.m===""?"":m,v.d]);save();render();
  // clear every tree field so nothing carries over to the next tree
  ["species","dbh","product","tht","mht","defect"].forEach(id=>$(id).value="");
  msg("Added to plot "+cur+".",true);$("species").focus();
};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest("#treecard .grid")){e.preventDefault();$("add").click();}});
$("clear").onclick=()=>{if(confirm("Delete all "+rows.length+" entries?")){rows=[];cur="";save();render();msg("");}};

function csvCell(v){const s=String(v);return /[",\r\n]/.test(s)?"\""+s.replace(/"/g,"\"\"")+"\"":s;}
function buildCsv(){
  const ordered=[].concat(...groups().map(g=>g.idx.map(i=>rows[i])));
  return [COLS].concat(ordered).map(r=>r.map(csvCell).join(",")).join("\r\n")+"\r\n";
}
$("dl").onclick=()=>{
  try{
    const stamp=new Date().toISOString().slice(0,10);
    const blob=new Blob(["\ufeff"+buildCsv()],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="tree_data_"+stamp+".csv";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    msg("CSV downloaded (check your Downloads folder).",true);
  }catch(e){msg("Couldn’t download. Try Copy CSV instead.");}
};
$("copy").onclick=async()=>{
  const csv=buildCsv();
  try{await navigator.clipboard.writeText(csv);msg("CSV copied. Paste it into an email or a text file.",true);}
  catch(e){
    const ta=document.createElement("textarea");ta.value=csv;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy");}catch(x){}
    ta.remove();msg(ok?"CSV copied. Paste it into an email or a text file.":"Couldn’t copy on this device.",ok);
  }
};
render();
</script>
</body>
</html>
